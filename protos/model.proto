syntax = "proto3";

package model;

service ModelService {
  rpc Generate (GenerateRequest) returns (GenerateResponse);
}

message GenerateRequest {
  string prompt = 1;
  string session_id = 2;
  string system = 3;
}

message GenerateResponse {
  string text = 1;
  string model = 2;
  string stop_reason = 3;
}
